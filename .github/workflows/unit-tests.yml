      IMAGE_INDEXER_REDIS_INTEGRATION_ADDR: 127.0.0.1:6379
    defaults:
      run:
        working-directory: ./services/image-indexer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/image-indexer/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m venv "${RUNNER_TEMP}/pip-audit"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip install "pip-audit==2.10.1"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip_audit --requirement requirements.txt
      - name: Run unit, Redis DB15, and MongoDB lock integration tests
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"Refusing skipped tests: {result.skipped}")
              raise SystemExit(1)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

  audit-release-python-services:
    name: Audit ${{ matrix.service }} Python Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backlinks-processor, tfidf, dmoz-importer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Audit image requirements without creating lock files
        working-directory: ./services/${{ matrix.service }}
        run: |
          python -m venv "${RUNNER_TEMP}/pip-audit"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip install "pip-audit==2.10.1"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip_audit --requirement requirements.txt

  test-monitoring:
    name: Check Monitoring Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/monitoring
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Rust 1.85.1
        uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
        with:
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: services/monitoring -> target
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  test-query-engine-image-component:
    name: Test Query Engine
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/query-engine/package-lock.json
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: mongodb-1.21.0
          tools: composer
          coverage: none
      - name: Install Composer dependencies
        working-directory: ./services/query-engine
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer lockfile including dev dependencies
        working-directory: ./services/query-engine
        run: composer audit --locked
      - name: Build frontend assets
        working-directory: ./services/query-engine
        run: npm ci && npm run build
      - name: Test query engine
        working-directory: ./services/query-engine
        env:
          QUERY_MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017
        run: php artisan test

