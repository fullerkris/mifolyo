name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: ["main", "crawl_seeds-and-url-rules-rebuild"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-spider:
    name: Test Spider Service
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SPIDER_REDIS_INTEGRATION_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate explicit crawl Compose profiles
        run: |
          python - <<'PY'
          import json
          import subprocess

          for compose_file in (
              "docker-compose.yml",
              "scripts/docker/v1-baseline.compose.yml",
          ):
              pipeline_services = subprocess.check_output(
                  [
                      "docker", "compose", "--file", compose_file,
                      "--profile", "pipeline", "config", "--services",
                  ],
                  text=True,
              ).splitlines()
              assert "spider" not in pipeline_services, (compose_file, pipeline_services)
              assert "image-indexer" not in pipeline_services, (compose_file, pipeline_services)
              assert "render-worker" not in pipeline_services, (compose_file, pipeline_services)

              resolved = json.loads(
                  subprocess.check_output(
                      [
                          "docker", "compose", "--file", compose_file,
                          "--profile", "crawl", "config", "--format", "json",
                      ],
                      text=True,
                  )
              )
              spider = resolved["services"]["spider"]
              assert spider["profiles"] == ["crawl"], (compose_file, spider["profiles"])
              assert spider["command"] == [
                  "./spider", "--validate-policy", "--validate-baseline-policy"
              ], (compose_file, spider["command"])
              environment = spider["environment"]
              assert environment["USER_AGENT"] == "MiFolyoBot/1.0", environment
              assert environment["CRAWL_QUEUE_KEY"] == "mifolyo:crawl:v1:queue", environment
              assert environment["CRAWL_URLS_KEY"] == "mifolyo:crawl:v1:urls", environment
              assert environment["CRAWL_DEPTHS_KEY"] == "mifolyo:crawl:v1:depths", environment
              assert "STARTING_URL" not in environment, environment
              assert "image-indexer" not in resolved["services"], (
                  compose_file, resolved["services"].keys()
              )
              assert "render-worker" not in resolved["services"], (
                  compose_file, resolved["services"].keys()
              )

              if compose_file == "scripts/docker/v1-baseline.compose.yml":
                  assert spider["user"] == "65534:65534", spider["user"]
                  assert spider["read_only"] is True, spider["read_only"]
                  assert spider["cap_drop"] == ["ALL"], spider["cap_drop"]
                  assert "no-new-privileges:true" in spider["security_opt"], spider["security_opt"]
                  assert list(spider["networks"]) == ["crawl"], spider["networks"]
                  assert spider["mem_limit"] == "268435456", spider["mem_limit"]
                  assert spider["pids_limit"] == 128, spider["pids_limit"]

              render_resolved = json.loads(
                  subprocess.check_output(
                      [
                          "docker", "compose", "--file", compose_file,
                          "--profile", "render", "config", "--format", "json",
                      ],
                      text=True,
                  )
              )
              assert "spider" not in render_resolved["services"], (
                  compose_file, render_resolved["services"].keys()
              )
              worker = render_resolved["services"]["render-worker"]
              assert worker["profiles"] == ["render"], (compose_file, worker["profiles"])
              assert worker["user"] == "65534:65534", worker["user"]
              assert worker["network_mode"] == "none", worker["network_mode"]
              assert worker["read_only"] is True, worker["read_only"]
              assert worker["cap_drop"] == ["ALL"], worker["cap_drop"]
              assert worker["init"] is True, worker["init"]
              assert "no-new-privileges:true" in worker["security_opt"], worker["security_opt"]
              assert any(
                  option.startswith("seccomp=") for option in worker["security_opt"]
              ), worker["security_opt"]
              assert worker["environment"] == {
                  "CHROMIUM_EXECUTABLE_PATH": "/usr/bin/chromium",
                  "HOME": "/tmp",
                  "RENDER_SOCKET": "/run/mifolyo-render/renderer.sock",
              }, worker["environment"]
              assert "/tmp:rw,noexec,nosuid,size=256m" in worker["tmpfs"], worker["tmpfs"]
              assert "/dev/shm:rw,nosuid,size=256m" in worker["tmpfs"], worker["tmpfs"]
              assert worker["mem_limit"] == "805306368", worker["mem_limit"]
              assert worker["pids_limit"] == 256, worker["pids_limit"]
          PY
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: services/spider/go.sum
      - name: Build
        working-directory: ./services/spider
        run: go build -v ./cmd/spider/main.go
      - name: Validate baseline crawl policy
        working-directory: ./services/spider
        run: >-
          go run ./cmd/spider
          --validate-policy
          --validate-baseline-policy
          --crawl-policy-file ./config/crawl-policy-v1.baseline.json
      - name: Test
        working-directory: ./services/spider
        run: go test -race -v ./...
      - name: Scan Go dependencies and call paths
        working-directory: ./services/spider
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  test-seed-importer:
    name: Test Seed Importer Service
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/mifolyo_index
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    defaults:
      run:
        working-directory: ./services/seed-importer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/seed-importer/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m venv "${RUNNER_TEMP}/pip-audit"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip install "pip-audit==2.10.1"
          "${RUNNER_TEMP}/pip-audit/bin/python" -m pip_audit --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Redis Lua metadata rejection
        run: |
          python - <<'PY'
          import os

          from redis import Redis
          from redis.exceptions import ResponseError

          from feed import ENQUEUE_SCRIPT

          client = Redis(
              host=os.environ["REDIS_HOST"],
              port=int(os.environ["REDIS_PORT"]),
              db=int(os.environ["REDIS_DB"]),
              decode_responses=True,
          )
          queue = "mifolyo:test:depth-validation:queue"
          urls = "mifolyo:test:depth-validation:urls"
          depths = "mifolyo:test:depth-validation:depths"
          url_id = "depth-test-id"
          canonical_url = "https://example.com/depth-test"
          try:
              for corrupt_depth in ("-1", "00", "9007199254740992"):
                  client.delete(queue, urls, depths)
                  client.zadd(queue, {url_id: 2})
                  client.hset(urls, url_id, canonical_url)
                  client.hset(depths, url_id, corrupt_depth)
                  try:
                      client.eval(
                          ENQUEUE_SCRIPT,
                          3,
                          queue,
                          urls,
                          depths,
                          url_id,
                          canonical_url,
                          0,
                          0,
                      )
                  except ResponseError as exc:
                      assert "INVALID_EXISTING_DEPTH" in str(exc), exc
                  else:
                      raise AssertionError(f"accepted corrupt depth {corrupt_depth!r}")
                  assert client.zscore(queue, url_id) == 2
                  assert client.hget(depths, url_id) == corrupt_depth

              client.delete(queue, urls, depths)
              client.zadd(queue, {url_id: float("inf")})
              client.hset(urls, url_id, canonical_url)
              client.hset(depths, url_id, "0")
              try:
                  client.eval(
                      ENQUEUE_SCRIPT,
                      3,
                      queue,
                      urls,
                      depths,
                      url_id,
                      canonical_url,
                      0,
                      0,
                  )
              except ResponseError as exc:
                  assert "INVALID_EXISTING_SCORE" in str(exc), exc
              else:
                  raise AssertionError("accepted non-finite existing score")
          finally:
              client.delete(queue, urls, depths)
              client.close()
          PY
      - name: Rebuild and feed isolated V1 baseline
        env:
          MIFOLYO_ENV: development
        run: |
          python crawl_seeds.py rebuild \
            --mongo-uri "${MONGO_URI}" \
            --confirm-rebuild localhost:27017/mifolyo_index/crawl_seeds
          python - <<'PY'
          import os

          from pymongo import MongoClient
          from redis import Redis

          from feed import DEPTHS_KEY, QUEUE_KEY, URLS_KEY
          from mongo_seeds import COLLECTION_NAME, DATABASE_NAME

          mongo = MongoClient(os.environ["MONGO_URI"])
          redis = Redis(
              host=os.environ["REDIS_HOST"],
              port=int(os.environ["REDIS_PORT"]),
              db=int(os.environ["REDIS_DB"]),
              decode_responses=True,
          )
          disabled = list(
              mongo[DATABASE_NAME][COLLECTION_NAME].find(
                  {"enabled": False}, {"_id": 1, "canonical_url": 1}
              )
          )
          assert len(disabled) == 3, disabled
          with redis.pipeline(transaction=True) as pipeline:
              for record in disabled:
                  pipeline.zadd(QUEUE_KEY, {record["_id"]: 0})
                  pipeline.hset(URLS_KEY, record["_id"], record["canonical_url"])
                  pipeline.hset(DEPTHS_KEY, record["_id"], "0")
              pipeline.execute()
          redis.close()
          mongo.close()
          print("inserted 3 stale disabled queue entries for reconciliation test")
          PY
          python feed.py --mongo-uri "${MONGO_URI}" --limit 1000
      - name: Verify MongoDB and Redis V1 state
        run: |
          python - <<'PY'
          import os

          from pymongo import MongoClient
          from redis import Redis

          from feed import DEPTHS_KEY, QUEUE_KEY, URLS_KEY
          from mongo_seeds import COLLECTION_NAME, COLLECTION_VALIDATOR, DATABASE_NAME

          mongo = MongoClient(os.environ["MONGO_URI"])
          collection = mongo[DATABASE_NAME][COLLECTION_NAME]
          redis = Redis(
              host=os.environ["REDIS_HOST"],
              port=int(os.environ["REDIS_PORT"]),
              db=int(os.environ["REDIS_DB"]),
              decode_responses=True,
          )

          record_count = collection.count_documents({})
          enabled_count = collection.count_documents({"enabled": True})
          disabled_count = collection.count_documents({"enabled": False})
          queue_count = redis.zcard(QUEUE_KEY)
          mapping_count = redis.hlen(URLS_KEY)
          depth_count = redis.hlen(DEPTHS_KEY)
          assert record_count == 70, record_count
          assert enabled_count == 67, enabled_count
          assert disabled_count == 3, disabled_count
          assert queue_count == 67, queue_count
          assert mapping_count == 67, mapping_count
          assert depth_count == 67, depth_count

          record_ids = set(collection.distinct("_id"))
          enabled_record_ids = set(collection.distinct("_id", {"enabled": True}))
          disabled_urls = set(collection.distinct("canonical_url", {"enabled": False}))
          queue_ids = set(redis.zrange(QUEUE_KEY, 0, -1))
          mapping_ids = set(redis.hkeys(URLS_KEY))
          depth_ids = set(redis.hkeys(DEPTHS_KEY))
          assert enabled_record_ids == queue_ids == mapping_ids == depth_ids
          assert record_ids - enabled_record_ids
          assert disabled_urls == {
              "https://www.bbc.com/news",
              "https://www.khanacademy.org/",
              "https://www.politifact.com/",
          }, disabled_urls
          assert set(redis.hmget(DEPTHS_KEY, sorted(depth_ids))) == {"0"}

          info = mongo[DATABASE_NAME].command(
              {"listCollections": 1, "filter": {"name": COLLECTION_NAME}}
          )["cursor"]["firstBatch"]
          assert len(info) == 1, info
          options = info[0]["options"]
          assert options.get("validator") == COLLECTION_VALIDATOR
          assert options.get("validationLevel") == "strict"
          assert options.get("validationAction") == "error"

          required_indexes = {
              "uq_crawl_seeds_canonical_url",
              "ix_crawl_seeds_feed",
              "ix_crawl_seeds_source_key",
          }
          indexes = set(collection.index_information())
          assert required_indexes <= indexes, indexes

          redis.close()
          mongo.close()
          print("verified 70 V1 records, 67 enabled queue entries, and 3 disabled targets")
          PY

