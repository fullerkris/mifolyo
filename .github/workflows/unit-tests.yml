  test-render-worker:
    name: Test Render Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: services/render-worker/package-lock.json
      - name: Run protocol tests
        working-directory: ./services/render-worker
        run: npm ci --ignore-scripts && npm test && npm audit --omit=dev --audit-level=high
      - name: Build renderer image
        working-directory: ./services/render-worker
        run: docker build --tag mifolyo-render-worker:test .
      - name: Run sandboxed networkless Chromium smoke tests
        run: >-
          docker run --rm
          --network none
          --read-only
          --user 65534:65534
          --cap-drop ALL
          --security-opt no-new-privileges:true
          --security-opt seccomp=services/render-worker/seccomp_profile.json
          --tmpfs /tmp:rw,noexec,nosuid,size=256m
          --tmpfs /dev/shm:rw,nosuid,size=256m
          mifolyo-render-worker:test node smoke.mjs
      - name: Run Go-to-Chromium IPC integration
        run: |
          set -eu
          volume="mifolyo-render-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker="mifolyo-render-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${worker}" >/dev/null 2>&1 || true
            docker volume rm --force "${volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --target builder --tag mifolyo-spider-builder:test services/spider
          docker volume create "${volume}" >/dev/null
          docker run --detach --name "${worker}" \
            --network none \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=services/render-worker/seccomp_profile.json \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --tmpfs /dev/shm:rw,nosuid,size=256m \
            --mount "type=volume,source=${volume},target=/run/mifolyo-render" \
            mifolyo-render-worker:test >/dev/null

          socket_ready=false
          for _ in $(seq 1 30); do
            if docker run --rm \
              --network none \
              --read-only \
              --user 65534:65534 \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --mount "type=volume,source=${volume},target=/run/mifolyo-render,readonly" \
              --entrypoint /bin/sh \
              mifolyo-spider-builder:test \
              -ec 'test -S /run/mifolyo-render/renderer.sock'; then
              socket_ready=true
              break
            fi
            sleep 1
          done
          test "${socket_ready}" = true

          docker run --rm \
            --network none \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,exec,nosuid,size=1g \
            --mount "type=volume,source=${volume},target=/run/mifolyo-render,readonly" \
            --env HOME=/tmp \
            --env GOCACHE=/tmp/go-build \
            --env RENDER_WORKER_INTEGRATION_SOCKET=/run/mifolyo-render/renderer.sock \
            mifolyo-spider-builder:test \
            go test -count=1 -run '^TestNetworklessChromiumWorkerIntegration$' \
              -v ./internal/renderclient
