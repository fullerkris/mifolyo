name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: ["main", "crawl_seeds-and-url-rules-rebuild"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-spider:
    name: Test Spider Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache-dependency-path: services/spider/go.sum
      - name: Build
        working-directory: ./services/spider
        run: go build -v ./cmd/spider/main.go
      - name: Test
        working-directory: ./services/spider
        run: go test -v ./...

  test-seed-importer:
    name: Test Seed Importer Service
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/mifolyo_index
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    defaults:
      run:
        working-directory: ./services/seed-importer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/seed-importer/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild and feed isolated V1 baseline
        env:
          MIFOLYO_ENV: development
        run: |
          python crawl_seeds.py rebuild \
            --mongo-uri "${MONGO_URI}" \
            --confirm-rebuild localhost:27017/mifolyo_index/crawl_seeds
          python feed.py --mongo-uri "${MONGO_URI}" --limit 1000
      - name: Verify MongoDB and Redis V1 state
        run: |
          python - <<'PY'
          import os

          from pymongo import MongoClient
          from redis import Redis

          from feed import QUEUE_KEY, URLS_KEY
          from mongo_seeds import COLLECTION_NAME, COLLECTION_VALIDATOR, DATABASE_NAME

          mongo = MongoClient(os.environ["MONGO_URI"])
          collection = mongo[DATABASE_NAME][COLLECTION_NAME]
          redis = Redis(
              host=os.environ["REDIS_HOST"],
              port=int(os.environ["REDIS_PORT"]),
              db=int(os.environ["REDIS_DB"]),
              decode_responses=True,
          )

          record_count = collection.count_documents({})
          queue_count = redis.zcard(QUEUE_KEY)
          mapping_count = redis.hlen(URLS_KEY)
          assert record_count == 70, record_count
          assert queue_count == 70, queue_count
          assert mapping_count == 70, mapping_count

          record_ids = set(collection.distinct("_id"))
          queue_ids = set(redis.zrange(QUEUE_KEY, 0, -1))
          mapping_ids = set(redis.hkeys(URLS_KEY))
          assert record_ids == queue_ids == mapping_ids

          info = mongo[DATABASE_NAME].command(
              {"listCollections": 1, "filter": {"name": COLLECTION_NAME}}
          )["cursor"]["firstBatch"]
          assert len(info) == 1, info
          options = info[0]["options"]
          assert options.get("validator") == COLLECTION_VALIDATOR
          assert options.get("validationLevel") == "strict"
          assert options.get("validationAction") == "error"

          required_indexes = {
              "uq_crawl_seeds_canonical_url",
              "ix_crawl_seeds_feed",
              "ix_crawl_seeds_source_key",
          }
          indexes = set(collection.index_information())
          assert required_indexes <= indexes, indexes

          redis.close()
          mongo.close()
          print("verified 70 V1 records, queue IDs, and URL mappings")
          PY

  test-image-indexer:
    name: Test Image Indexer Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/image-indexer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/image-indexer/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run mocked unit tests
        run: python -m unittest discover -s tests -v

  test-monitoring:
    name: Check Monitoring Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/monitoring
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust 1.85.1
        uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/monitoring -> target
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  test-query-engine-image-component:
    name: Test Query Engine Image Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mongodb-1.21.0
          tools: composer
          coverage: none
      - name: Install Composer dependencies
        working-directory: ./services/query-engine
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test image component
        working-directory: ./services/query-engine
        run: php artisan test tests/Unit/ImageContainerTest.php

  test-indexer:
    name: Test Indexer Service
    runs-on: ubuntu-latest
    steps:
      - name: Indexer Placeholder
        run: echo "Indexer Placeholder!"
  # Add unit-test for the other services once I have them
