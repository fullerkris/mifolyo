x-moogle-env: &moogle-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  REDIS_DB: 0
  MONGO_HOST: mongo
  MONGO_PORT: 27017
  MONGO_DB: mifolyo_index
  MONGO_USERNAME: ""
  MONGO_PASSWORD: ""
  ALLOW_INSECURE_DATASTORES: "true"
  USER_AGENT: MiFolyoBot/1.0

services:
  laravel:
    build: ./services/query-engine
    image: mifolyo-query-engine
    working_dir: /var/www
    volumes:
      - ./services/query-engine/public:/var/www/public
      - query_engine_vendor:/var/www/vendor
      - query_engine_node_modules:/var/www/node_modules
    environment:
      APP_NAME: MiFolyo
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mifolyo
      DB_USERNAME: mifolyo
      DB_PASSWORD: mifolyo
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: mifolyo_index
      FORUM_API_BASE_URL: http://host.docker.internal:8000
      FORUM_DEFAULT_COMMUNITY_SLUG: general
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      ALLOW_INSECURE_DATASTORES: "true"
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - app

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./services/query-engine/Caddyfile:/etc/caddy/Caddyfile
      - ./services/query-engine/public:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - laravel
    networks:
      - app

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: mifolyo
      POSTGRES_USER: mifolyo
      POSTGRES_PASSWORD: mifolyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

  spider:
    build: ./services/spider
    image: mifolyo-spider
    profiles: ["crawl"]
    command: ["./spider", "--validate-policy", "--validate-baseline-policy"]
    environment:
      <<: *moogle-env
      CRAWL_QUEUE_KEY: mifolyo:crawl:v1:queue
      CRAWL_URLS_KEY: mifolyo:crawl:v1:urls
      CRAWL_DEPTHS_KEY: mifolyo:crawl:v1:depths
      CRAWL_POLICY_FILE: /app/config/crawl-policy-v1.baseline.json
      CRAWL_DENY_CIDRS: ${MIFOLYO_CRAWL_DENY_CIDRS:-}
      RENDER_POLICY_FILE: /app/config/render-policy-v1.disabled.json
      RENDER_SOCKET: /run/mifolyo-render/renderer.sock
    depends_on:
      - redis
    volumes:
      - render_socket:/run/mifolyo-render:ro
    networks:
      - app

  render-worker:
    build: ./services/render-worker
    image: mifolyo-render-worker
    profiles: ["render"]
    init: true
    user: "65534:65534"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=./services/render-worker/seccomp_profile.json
    cap_drop:
      - ALL
    environment:
      RENDER_SOCKET: /run/mifolyo-render/renderer.sock
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      HOME: /tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /dev/shm:rw,nosuid,size=256m
    volumes:
      - render_socket:/run/mifolyo-render
    cpus: "1.00"
    mem_limit: 768m
    pids_limit: 256

  indexer:
    build: ./services/indexer
    image: mifolyo-indexer
    profiles: ["pipeline"]
    environment:
      <<: *moogle-env
    depends_on:
      - redis
      - mongo
    networks:
      - app

  image-indexer:
    build: ./services/image-indexer
    image: mifolyo-image-indexer
    profiles: ["image-pipeline"]
    environment:
      <<: *moogle-env
    depends_on:
      - redis
      - mongo
    networks:
      - app

  backlinks-processor:
    build: ./services/backlinks-processor
    image: mifolyo-backlinks-processor
    profiles: ["pipeline"]
    environment:
      <<: *moogle-env
    depends_on:
      - redis
      - mongo
    networks:
      - app

  tfidf:
    build: ./services/tfidf
    image: mifolyo-tfidf
    profiles: ["batch"]
    environment:
      <<: *moogle-env
      OPERATIONS_THRESHOLD: 1000
      NUM_THREADS: 2
    depends_on:
      - mongo
    networks:
      - app

  page-rank:
    build: ./services/page-rank
    image: mifolyo-page-rank
    profiles: ["batch"]
    environment:
      <<: *moogle-env
    depends_on:
      - mongo
    networks:
      - app

  dmoz-importer:
    build: ./services/dmoz-importer
    image: mifolyo-dmoz-importer
    profiles: ["batch"]
    environment:
      <<: *moogle-env
    volumes:
      - ./data:/data
    depends_on:
      - mongo
    networks:
      - app

  seed-importer:
    build: ./services/seed-importer
    image: mifolyo-seed-importer
    profiles: ["batch"]
    environment:
      <<: *moogle-env
    volumes:
      - ./seeds:/seeds:ro
      - ./data:/data
    depends_on:
      - redis
      - mongo
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  mongo_data:
  postgres_data:
  query_engine_vendor:
  query_engine_node_modules:
  render_socket:

networks:
  app:
    driver: bridge
