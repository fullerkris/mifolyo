# Test-only, networkless M4 configuration. No default unauthenticated user.
port 0
unixsocket /run/cj2/redis.sock
unixsocketperm 600
aclfile /run/cj2/fixture.acl
dir /data
appendonly yes
appendfsync always
aof-use-rdb-preamble yes
aof-load-truncated no
no-appendfsync-on-rewrite no
maxmemory-policy noeviction
stop-writes-on-bgsave-error yes
maxmemory 419430400
lua-time-limit 5000
cluster-enabled no
enable-debug-command no
enable-module-command no
rename-command FLUSHDB ""
rename-command FLUSHALL ""
